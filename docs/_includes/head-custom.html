<!-- GitHub draws ```mermaid blocks; Jekyll leaves them as code, so draw them here -->
<script type="module">
  const blocks = document.querySelectorAll("div.language-mermaid code");
  if (blocks.length) {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs");
    for (const code of blocks) {
      const pre = document.createElement("pre");
      pre.className = "mermaid";
      pre.textContent = code.textContent;
      code.closest("div.language-mermaid").replaceWith(pre);
    }
    mermaid.initialize({ startOnLoad: false });
    await mermaid.run();
  }
</script>
