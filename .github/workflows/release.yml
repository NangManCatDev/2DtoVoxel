name: release

# Push a tag like v0.3.0 (the version in pyproject.toml, with a "## 0.3.0" section in CHANGELOG.md):
# this builds the package, creates the GitHub release with that CHANGELOG section as its notes,
# and publishes to PyPI. PyPI needs a trusted publisher set up once: pypi.org → Publishing →
# project 2dtovoxel, owner NangManCatDev, repository 2DtoVoxel, workflow release.yml,
# environment pypi. If that job failed because it wasn't set up yet, re-run it after.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject.toml says $version"; exit 1; }
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - > notes.md <<'PY'
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(version)}\s*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "")
          print(f"\nFull history: https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/main/CHANGELOG.md")
          PY
          gh release create "$GITHUB_REF_NAME" dist/* --title "2DtoVoxel $GITHUB_REF_NAME" --notes-file notes.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/2dtovoxel/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
