[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "2dtovoxel"
version = "0.3.0"
description = "Turn a picture into a MagicaVoxel voxel model: Claude Code writes a voxel build script, scores each build against the picture and keeps fixing it."
dynamic = ["readme"]  # setup.py: README.md with links that work on PyPI
license = {text = "MIT"}
authors = [{name = "NangManCatDev"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10.0", "scipy>=1.10"]
keywords = ["voxel", "magicavoxel", "vox", "image-to-voxel", "image-to-3d", "voxel-art", "claude", "claude-code",
            "ai", "pixel-art", "sprites", "game-assets", "gamedev", "gltf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/NangManCatDev/2DtoVoxel"
Documentation = "https://nangmancatdev.github.io/2DtoVoxel/"
Changelog = "https://github.com/NangManCatDev/2DtoVoxel/blob/main/CHANGELOG.md"
Issues = "https://github.com/NangManCatDev/2DtoVoxel/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
voxtool = "voxtool.__main__:main"

[tool.setuptools]
packages = ["voxtool", "voxtool.ui"]

[tool.setuptools.package-data]
voxtool = ["mv_screenshot.ps1"]
"voxtool.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
